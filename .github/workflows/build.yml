# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build gametestClasses
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # Starts a real Minecraft client in a virtual display, checks the blade renderer, the ignite and
  # retract animation and the sounds, and takes screenshots of the saber in first and third person.
  client-gametest:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      # The runner has no sound card. OpenAL writes the game audio into a wave file instead, so the
      # sound tests run against the real sound engine and the recording can be listened to.
      - name: route game audio into a file
        run: |
          mkdir -p build/run/clientGameTest
          printf '[general]\ndrivers = wave\nchannels = mono\n[wave]\nfile = %s/build/run/clientGameTest/game-audio.wav\n' "$PWD" > ~/.alsoftrc
      - name: run client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: build/run/clientGameTest/screenshots/
      - name: upload audio recording
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Audio
          path: build/run/clientGameTest/game-audio.wav
